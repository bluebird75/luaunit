name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Combination matrix:
#
# Lua         |  Linux  | Windows | MacOSX  |
# ------------|-----------------------------|
# LuaJit 2.0  |    X    |         |         |
# ------------|-----------------------------|
# Lua 5.1     |    X    |         |         |
# ------------|-----------------------------|
# Lua 5.2     |         |         |    X    |
# ------------|-----------------------------|
# Lua 5.3     |         |    X    |         |
# ------------|-----------------------------|
# Lua 5.4     |    X    |         |         |
# ------------|-----------------------------|
# Lua 5.5     |    X    |    X    |    X    |
# ------------|-----------------------------|   
#
# Strategy:
# - newest version is tested on all platform
# - Each of lua 5.1, lua 5.2, lua 5.3, luajit 2.0 is tested only on one platform
jobs:
  lua:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            luaVersion: luajit-2.0

          - os: ubuntu-latest
            luaVersion: 5.1

          - os: macos-latest
            luaVersion: 5.2

          - os: windows-latest
            luaVersion: 5.3

          - os: ubuntu-latest
            luaVersion: 5.4

          # Run lua 5.5 on all platforms
          - os: ubuntu-latest
            luaVersion: 5.5

          - os: macos-latest
            luaVersion: 5.5

          - os: windows-latest
            luaVersion: 5.5
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup msvc dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: setup lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.luaVersion }}

      - name: show lua version
        run: lua -v

      - name: run unit tests
        run: lua run_unit_tests.lua --shuffle
      
      - name: run functional tests
        run: lua run_functional_tests.lua 

      - name: setup luarocks
        if: matrix.os == 'ubuntu-latest' && matrix.luaVersion == '5.4'
        uses: leafo/gh-actions-luarocks@v6

      - name: install + run luacheck
        if: matrix.os == 'ubuntu-latest' && matrix.luaVersion == '5.4'
        run: |
          luarocks install luacheck
          luacheck example_with_luaunit.lua luaunit.lua run_unit_tests.lua run_functional_tests.lua test/


